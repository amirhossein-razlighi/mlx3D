[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mlx3d"
dynamic = ["version"]
description = "Differentiable 3D computer vision on Apple Silicon, built on MLX"
authors = [{ name = "AmirHossein Razlighi", email = "arazlighi@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "3D", "graphics", "renderer", "differentiable", "MLX", "Apple Silicon",
  "Metal", "gaussian splatting", "nerf", "computer vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "mlx>=0.31.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "numpy>=1.24",
  "pillow>=10.0",
  "tqdm>=4.66",
]

# Dev tooling is exposed two ways so every workflow works out of the box:
#   * project.optional-dependencies -> `pip install -e ".[dev]"` (any installer)
#   * dependency-groups (PEP 735)   -> `uv sync` installs it automatically
# Keep the two lists in sync.
[project.optional-dependencies]
capture = [
  # Built-in COLMAP-free SfM for `mlx3d-capture` (feature matching + bundle
  # adjustment). Not needed when the COLMAP binary is installed.
  "opencv-python>=4.8",
  "scipy>=1.11",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
mlx3d-capture = "mlx3d.cli.capture:main"
mlx3d-compact = "mlx3d.cli.compact:main"
mlx3d-eval = "mlx3d.cli.eval:main"
mlx3d-view = "mlx3d.viewer.__main__:main"
mlx3d-render = "mlx3d.cli.render:main"

[project.urls]
Homepage = "https://github.com/amirhossein-razlighi/mlx3D"
Documentation = "https://amirhossein-razlighi.github.io/mlx3D/"
Repository = "https://github.com/amirhossein-razlighi/mlx3D"

# Version is derived from the latest git tag (e.g. v0.3.0 -> 0.3.0) by
# hatch-vcs. Never hand-edit a version anywhere: tag the release and push.
[tool.hatch.version]
source = "vcs"

# Freeze the resolved version into the sdist so a wheel built from it (no .git)
# still gets the right number.
[tool.hatch.build.hooks.vcs]
version-file = "src/mlx3d/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx3d"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "smoke: fast import/public-API checks that the package is wired together",
  "unit: focused tests of a single function or class",
  "behavior: end-to-end gradient/optimization behavior across modules",
  "data: dataset loaders against synthetic in-process fixtures",
]
