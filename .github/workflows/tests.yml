name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    # Lint is platform-independent and needs no MLX, so run it fast on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.14.0 check .
      - name: Ruff format
        run: uvx ruff@0.14.0 format --check .

  test:
    needs: lint
    # macos-15 runners are Apple Silicon, required for MLX (Metal GPU).
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        # --extra capture pulls OpenCV + SciPy so the built-in SfM tests run.
        run: uv sync --extra capture
      - name: Smoke tests
        run: uv run pytest tests/ -m smoke -v
      - name: Unit + data tests
        run: uv run pytest tests/ -m "unit or data" -v
      - name: Behavior tests
        run: uv run pytest tests/ -m behavior -v
