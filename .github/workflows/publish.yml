name: publish

# Push a version tag to cut a release. The package version is derived from the
# tag by hatch-vcs (v0.3.0 -> 0.3.0), so nothing is hand-edited:
#
#     git tag v0.3.0 && git push origin v0.3.0
#
# That builds the sdist/wheel, publishes to PyPI (trusted publishing, no
# token), and opens a GitHub Release with autogenerated notes.
on:
  push:
    tags:
      # Semver with an optional pre-release suffix, e.g. v0.3.0 or v0.3.0rc1.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[a-z]*[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history and tags to resolve the version.
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not an ancestor of origin/main. Release only from main."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify built version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/mlx3d-${expected}-py3-none-any.whl" ]; then
            echo "::error::Expected dist/mlx3d-${expected}-py3-none-any.whl but built:"
            ls -1 dist/
            exit 1
          fi
          echo "Built mlx3d ${expected} from tag ${GITHUB_REF_NAME}."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release with autogenerated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $prerelease
